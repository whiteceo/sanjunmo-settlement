<style>
  :root {
    --bg: #f3f6fb;
    --card: #ffffff;
    --ink: #0f172a;
    --muted: #475569;
    --sub: #64748b;
    --line: #dbe3ef;
    --line-strong: #b8c6db;
    --pri: #1d4ed8;
    --pri-soft: #eff6ff;
    --ok: #15803d;
    --ok-soft: #dcfce7;
    --ok-line: #86efac;
    --warn: #b45309;
    --warn-soft: #fffbeb;
    --warn-line: #fcd34d;
    --bad: #b91c1c;
    --bad-soft: #fee2e2;
    --bad-line: #fca5a5;
    --shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
    --radius: 12px;
    --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
    --mono: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font);
    color: var(--ink);
    background: var(--bg);
    line-height: 1.5;
    font-size: 13px;
  }
  .main { display: flex; flex-direction: column; min-width: 0; padding-bottom: 60px; }

  /* Top Header Bar */
  .page-top-banner {
    background: #111827;
    color: #ffffff;
    padding: 10px 28px;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: -0.01em;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .topbar {
    background: #ffffff;
    border-bottom: 1px solid var(--line);
    padding: 18px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .title-wrap h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 900;
    letter-spacing: -0.02em;
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .title-wrap h1 small {
    font-size: 13px;
    font-weight: 600;
    color: var(--sub);
  }
  .breadcrumb {
    font-size: 12px;
    color: var(--sub);
    font-weight: 600;
  }

  .content { padding: 20px 28px; display: flex; flex-direction: column; gap: 16px; max-width: 1480px; }

  /* Search Filter Box */
  .search-table {
    width: 100%;
    background: #ffffff;
    border: 1px solid var(--line);
    border-radius: 10px;
    border-collapse: collapse;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .search-table th {
    width: 120px;
    background: #f8fafc;
    color: #334155;
    font-weight: 800;
    padding: 11px 14px;
    border-right: 1px solid var(--line);
    text-align: left;
    font-size: 12.5px;
  }
  .search-table td {
    padding: 9px 14px;
    border-right: 1px solid var(--line);
  }
  .search-table td:last-child { border-right: none; }

  input[type="text"], input[type="number"], select {
    padding: 7px 11px;
    border: 1px solid var(--line-strong);
    border-radius: 6px;
    font-size: 12.5px;
    font-family: inherit;
    color: var(--ink);
    background: #ffffff;
  }
  input[type="text"]:focus, select:focus {
    outline: none;
    border-color: #16a34a;
    box-shadow: 0 0 0 2px rgba(22, 163, 74, 0.12);
  }
  .field-ro {
    background: #f1f5f9 !important;
    color: #475569 !important;
    border-color: #cbd5e1 !important;
    cursor: not-allowed;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    border-radius: 6px;
    border: 1px solid #cbd5e1;
    font-size: 12.5px;
    font-weight: 600;
  }

  /* Buttons & Badges */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 8px 14px; border-radius: 7px;
    font-size: 12.5px; font-weight: 800;
    border: 1px solid var(--line-strong);
    background: #ffffff; color: var(--ink);
    cursor: pointer; transition: 0.14s; font-family: inherit; white-space: nowrap;
  }
  .btn:hover { background: #f8fafc; }
  .btn-dark { background: #111827; color: #ffffff; border-color: #111827; }
  .btn-dark:hover { background: #1f2937; }
  .btn-danger-outline { background: #ffffff; color: #dc2626; border-color: #fca5a5; }
  .btn-danger-outline:hover { background: #fef2f2; }
  .btn-sm { padding: 4px 9px; font-size: 11.5px; border-radius: 5px; }

  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 8px; border-radius: 999px;
    font-size: 11px; font-weight: 800; white-space: nowrap;
  }
  .b-on { background: var(--ok-soft); color: var(--ok); }
  .b-off { background: var(--bad-soft); color: var(--bad); }
  .b-default { background: #e2e8f0; color: #475569; }

  /* Two-Column Workspace */
  .workspace-grid {
    display: grid;
    grid-template-columns: 350px 1fr;
    gap: 20px;
    align-items: start;
  }

  .panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .panel-hd {
    padding: 13px 16px;
    border-bottom: 1px solid var(--line);
    background: #f8fafc;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .panel-hd h2 {
    margin: 0;
    font-size: 13.5px;
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .panel-hd h2 small {
    font-weight: 500;
    color: var(--sub);
    font-size: 11.5px;
  }
  .panel-bd { padding: 14px 16px; }

  /* Left Category Tree */
  .tree-list { display: flex; flex-direction: column; gap: 4px; }
  .tree-node {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 10px;
    border-radius: 7px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: 0.12s;
    user-select: none;
  }
  .tree-node:hover { background: #f8fafc; border-color: var(--line); }
  .tree-node.depth-1 { font-weight: 800; font-size: 13px; margin-top: 4px; }
  .tree-node.depth-2 { margin-left: 20px; font-weight: 600; font-size: 12.5px; color: #334155; }
  .tree-node.inactive-node { color: #94a3b8; }
  .tree-node.selected {
    background: #eff6ff !important;
    border-color: #93c5fd !important;
    color: #1e3a8a !important;
  }
  .drag-handle {
    color: #94a3b8;
    font-family: var(--mono);
    font-size: 12px;
    margin-right: 6px;
    cursor: grab;
  }
  .tree-meta { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--sub); }
  .order-arrows { display: inline-flex; gap: 2px; margin-left: 4px; }
  .arrow-btn {
    border: 1px solid #cbd5e1;
    background: #fff;
    color: #475569;
    font-size: 9px;
    padding: 1px 4px;
    border-radius: 3px;
    cursor: pointer;
  }
  .arrow-btn:hover { background: #e2e8f0; }

  .tree-actions {
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    gap: 8px;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
  }

  /* Right Detail Form */
  .section-title-bar {
    padding: 0 0 8px 0;
    border-bottom: 2px solid #0f172a;
    margin-bottom: 14px;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .section-title-bar h3 { margin: 0; font-size: 14.5px; font-weight: 900; }
  .section-title-bar span { font-size: 12px; color: var(--sub); font-weight: 600; }

  .form-block { margin-bottom: 14px; }
  .form-block label {
    display: block;
    font-size: 12px;
    font-weight: 800;
    color: #1e293b;
    margin-bottom: 5px;
  }
  .req { color: #dc2626; margin-left: 2px; }
  .help-txt { font-size: 11.5px; color: var(--sub); margin-top: 4px; }
  .help-warn { font-size: 11.5px; color: #b45309; font-weight: 600; margin-top: 5px; }

  .chk-group { display: flex; gap: 8px; align-items: center; }
  .chk-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border: 1px solid var(--line-strong);
    border-radius: 6px;
    background: #fff;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
  }
  .chk-pill.active-pill {
    border-color: #2563eb;
    background: #eff6ff;
    color: #1d4ed8;
  }

  /* Connected Courses Table */
  table.data-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.data-table th {
    background: #f8fafc;
    color: var(--muted);
    font-weight: 800;
    padding: 9px 12px;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    text-align: center;
  }
  table.data-table th.left, table.data-table td.left { text-align: left; }
  table.data-table td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
    text-align: center;
  }

  .bottom-action-row {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 18px;
  }
  .constraint-note {
    margin-top: 12px;
    padding: 10px 14px;
    background: #f8fafc;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 12px;
    color: #475569;
  }

  .toast {
    position: fixed; bottom: 24px; right: 28px;
    background: #0f172a; color: #fff; padding: 11px 16px;
    border-radius: 9px; font-size: 12.5px; font-weight: 700;
    box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    display: none; z-index: 300; border-left: 4px solid #38bdf8;
  }

function getFilteredCategories() {

  const kw = document.getElementById("filterKeyword").value.trim().toLowerCase();
  return CATEGORIES.filter(c => {
    if (st === "ON" && !c.active) return false;
    if (st === "OFF" && c.active) return false;
    if (kw && !c.name.toLowerCase().includes(kw) && !c.code.toLowerCase().includes(kw)) return false;
    return true;
  });
}

function moveOrder(id, dir) {
  const idx = CATEGORIES.findIndex(c => c.id === id);
  if (idx === -1) return;
  const target = CATEGORIES[idx];

  // 동일 parentId 및 동일 depth 내에서 순서 교환
  const siblings = CATEGORIES.filter(c => c.depth === target.depth && c.parentId === target.parentId);
  const sIdx = siblings.findIndex(c => c.id === id);
  const swapIdx = sIdx + dir;
  if (swapIdx < 0 || swapIdx >= siblings.length) return;

  const other = siblings[swapIdx];
  const tmpOrder = target.order;
  target.order = other.order;
  other.order = tmpOrder;

  if (target.depth === 2) {
    target.numLabel = String(target.order).padStart(2, "0") + ".";
    other.numLabel = String(other.order).padStart(2, "0") + ".";
  } else {
    target.numLabel = target.order + ".";
    other.numLabel = other.order + ".";
  }

  // 배열 내 위치 정렬
  sortCategoriesInPlace();
  renderTree();
  if (selectedId === id) renderDetail();
}

function sortCategoriesInPlace() {
  const depth1List = CATEGORIES.filter(c => c.depth === 1).sort((a, b) => a.order - b.order);
  const rebuilt = [];
  for (const d1 of depth1List) {
    rebuilt.push(d1);
    const children = CATEGORIES.filter(c => c.depth === 2 && c.parentId === d1.id).sort((a, b) => a.order - b.order);
    rebuilt.push(...children);
  }
  CATEGORIES.length = 0;
  CATEGORIES.push(...rebuilt);
}

  const siblings = CATEGORIES.filter(c => c.depth === depth && c.parentId === (parentNode ? parentNode.id : null));
  const nextOrder = siblings.length + 1;

  draftNode = {

  renderTree();
  renderDetail();
}

function setNodeActive(flag) {
  const node = isNewMode ? draftNode : CATEGORIES.find(c => c.id === selectedId);
  if (!node) return;
  node.active = flag;
  renderDetail();
}

function saveCategory() {
  const nameVal = document.getElementById("inpCatName").value.trim();
  if (!nameVal) {
    alert("카테고리명을 입력해 주세요. (최대 30자)");
    return;
  }

  if (isNewMode && draftNode) {
    draftNode.name = nameVal;
    draftNode.code = "CAT_AUTO_" + Math.random().toString(36).substring(2, 7).toUpperCase();
    CATEGORIES.push(draftNode);
    sortCategoriesInPlace();
    selectedId = draftNode.id;
    isNewMode = false;
    draftNode = null;
    renderTree();
    renderDetail();
    showToast(`신규 카테고리 '${nameVal}'가 자동 코드로 생성·저장되었습니다.`);
  } else {
    const node = CATEGORIES.find(c => c.id === selectedId);
    if (!node) return;
    node.name = nameVal;
    // 1Depth를 비활성으로 바꾸면 하위 2Depth도 함께 비활성 연동 시뮬레이션
    if (node.depth === 1 && !node.active) {
      CATEGORIES.filter(c => c.parentId === node.id).forEach(ch => ch.active = false);
    }
    renderTree();
    renderDetail();
    showToast(`카테고리 '${node.name}' 정보가 저장되었습니다.`);
  }
}

function deleteCategory() {
  const node = CATEGORIES.find(c => c.id === selectedId);
  if (!node) return;

  const childCount = CATEGORIES.filter(c => c.parentId === node.id).length;
  if (childCount > 0 || node.courses.length > 0) {
    alert("하위 항목을 먼저 이동하거나 삭제하세요.\n\n(사유: 하위 2Depth 카테고리 " + childCount + "건, 연결된 단과 강좌 " + node.courses.length + "건이 존재합니다.)");
    return;
  }

  if (!confirm(`'${node.name}' 카테고리를 삭제하시겠습니까?`)) return;
  const idx = CATEGORIES.findIndex(c => c.id === node.id);
  if (idx !== -1) CATEGORIES.splice(idx, 1);
  selectedId = CATEGORIES[0]?.id || "";
  renderTree();
  renderDetail();
  showToast(`'${node.name}' 카테고리가 삭제되었습니다.`);
}

function cancelEdit() {
  if (isNewMode) {
    isNewMode = false;
    draftNode = null;
  }
  renderTree();
  renderDetail();
  showToast("편집 내용이 취소되었습니다.");
}

window.addEventListener("DOMContentLoaded", () => {
  renderTree();
  renderDetail();
});

    var backdrop = btn.closest('.modal-backdrop, .p1-modal-backdrop, .s1-modal-backdrop, .s2-modal-backdrop');
    if (!backdrop) return;

    var txt = (btn.textContent || '').trim();
    var isCloseBtn = (
      txt === '✕' || txt === '×' || txt === 'X' || txt === 'x' ||
      txt === '취소' || txt === '닫기' || txt === '창 닫기' ||
      onclickAttr.indexOf('close') !== -1 ||
      onclickAttr.indexOf('Close') !== -1 ||
      btn.classList.contains('modal-close') ||
      btn.classList.contains('btn-close')
    );

    if (isCloseBtn) {
      setTimeout(function() { forceCloseModalEl(backdrop); }, 0);
    }
  }, true);

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') window.closeAllModals();
  });
})();
</script>
</body></html>
